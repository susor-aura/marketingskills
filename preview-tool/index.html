<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NÉVUE · Social Preview Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:     #0B1F3A;
      --gold:     #C9A84C;
      --linen:    #FAF7F2;
      --charcoal: #1A1A2E;
      --mist:     #D6CFC5;
      --white:    #FFFFFF;
      --stage:    #111827;
    }

    html, body {
      height: 100%;
      font-family: 'Jost', system-ui, sans-serif;
      background: var(--stage);
      color: var(--charcoal);
      -webkit-font-smoothing: antialiased;
    }

    /* ── APP SHELL ─────────────────────────────────────── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── LEFT PANEL ────────────────────────────────────── */
    .panel-left {
      width: 360px;
      min-width: 360px;
      background: var(--linen);
      border-right: 1px solid var(--mist);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-header {
      padding: 28px 28px 22px;
      border-bottom: 1px solid var(--mist);
      flex-shrink: 0;
    }

    .panel-wordmark {
      display: block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.26em;
      color: var(--navy);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .panel-subtitle {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: var(--mist);
      text-transform: uppercase;
    }

    .panel-body {
      padding: 24px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Field groups */
    .field-group { display: flex; flex-direction: column; gap: 7px; }

    .field-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--navy);
      text-transform: uppercase;
    }

    /* Segmented controls */
    .seg-control {
      display: flex;
      border: 1px solid var(--mist);
    }

    .seg-btn {
      flex: 1;
      padding: 9px 4px;
      background: none;
      border: none;
      border-right: 1px solid var(--mist);
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--charcoal);
      text-transform: uppercase;
      transition: background 0.18s, color 0.18s;
      line-height: 1;
    }

    .seg-btn:last-child { border-right: none; }
    .seg-btn.active    { background: var(--navy); color: var(--gold); }
    .seg-btn:hover:not(.active) { background: rgba(11,31,58,0.06); }

    /* Text inputs */
    input[type="text"],
    textarea {
      width: 100%;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: var(--charcoal);
      background: var(--white);
      border: 1px solid var(--mist);
      padding: 10px 12px;
      outline: none;
      border-radius: 0;
      transition: border-color 0.18s;
      -webkit-appearance: none;
      resize: none;
    }

    input[type="text"]:focus,
    textarea:focus { border-color: var(--gold); }

    textarea { min-height: 80px; line-height: 1.6; }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 400;
      color: var(--charcoal);
    }

    .toggle {
      position: relative;
      width: 34px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--mist);
      transition: background 0.18s;
    }

    .toggle input:checked + .toggle-track { background: var(--gold); }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: white;
      transition: transform 0.18s;
      pointer-events: none;
    }

    .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

    /* Hairline divider */
    .rule { height: 1px; background: var(--mist); }

    /* Action buttons */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: var(--navy);
      color: var(--gold);
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }

    .btn-primary:hover:not(:disabled) { background: var(--gold); color: var(--navy); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 11px;
      background: transparent;
      color: var(--charcoal);
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--mist);
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s;
      text-align: center;
    }

    .btn-secondary:hover { border-color: var(--navy); color: var(--navy); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(201,168,76,0.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    .btn-primary.loading .btn-label { display: none; }
    .btn-primary:not(.loading) .btn-spinner { display: none; }

    /* History */
    .history-section {
      padding: 18px 28px 24px;
      border-top: 1px solid var(--mist);
      flex-shrink: 0;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      padding-bottom: 2px;
    }

    .history-title {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--navy);
      text-transform: uppercase;
    }

    .history-badge {
      font-size: 10px;
      color: var(--mist);
      font-weight: 400;
    }

    .history-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-empty {
      font-size: 12px;
      color: var(--mist);
      font-style: italic;
      padding: 8px 0 2px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      background: white;
      border: 1px solid var(--mist);
    }

    .history-item-info { flex: 1; min-width: 0; }

    .history-item-headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-meta {
      font-size: 10px;
      color: var(--mist);
      margin-top: 1px;
      letter-spacing: 0.04em;
    }

    .history-item-export {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .history-item-export:hover { color: var(--navy); }

    /* ── RIGHT PANEL ───────────────────────────────────── */
    .panel-right {
      flex: 1;
      background: var(--stage);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      overflow: hidden;
      gap: 20px;
    }

    .preview-label {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.22);
      text-transform: uppercase;
    }

    .preview-wrapper {
      /* display dimensions set by JS */
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.18),
        0 28px 80px rgba(0,0,0,0.65);
      flex-shrink: 0;
    }

    /* ── POST CARD ─────────────────────────────────────── */
    .post-card {
      position: relative;
      overflow: hidden;
      transform-origin: top left;
      /* width/height/transform set by JS */
    }

    /* Themes */
    .post-card.theme-dark  { background: #0B1F3A; }
    .post-card.theme-light { background: #FAF7F2; }

    /* Radial centre glow */
    .post-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .theme-dark  .post-glow { background: radial-gradient(ellipse at 50% 48%, rgba(201,168,76,0.08) 0%, transparent 62%); }
    .theme-light .post-glow { background: radial-gradient(ellipse at 50% 48%, rgba(11,31,58,0.04)  0%, transparent 62%); }

    /* Top & bottom gold bars */
    .post-bar {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent 0%, #C9A84C 25%, #C9A84C 75%, transparent 100%);
      z-index: 2;
    }

    .post-bar.top    { top: 0; }
    .post-bar.bottom { bottom: 0; }

    /* Corner accents */
    .post-corner { position: absolute; z-index: 2; }
    .post-corner.tl { top: 56px;    left: 56px; }
    .post-corner.br { bottom: 56px; right: 56px; }

    .post-corner span {
      position: absolute;
      display: block;
    }

    .post-corner.tl span:nth-child(1) { top: 0; left: 0; width: 1px;  height: 60px; }
    .post-corner.tl span:nth-child(2) { top: 0; left: 0; width: 60px; height: 1px; }
    .post-corner.br span:nth-child(1) { bottom: 0; right: 0; width: 1px;  height: 60px; }
    .post-corner.br span:nth-child(2) { bottom: 0; right: 0; width: 60px; height: 1px; }

    .theme-dark  .post-corner span { background: rgba(201,168,76,0.32); }
    .theme-light .post-corner span { background: rgba(11,31,58,0.18);  }

    /* Content layer */
    .post-inner {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      /* padding set by JS per format */
    }

    .post-wordmark {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      line-height: 1;
    }

    .theme-dark  .post-wordmark { color: rgba(250,247,242,0.92); }
    .theme-light .post-wordmark { color: #0B1F3A; }

    .post-gold-rule {
      width: 56px;
      height: 1px;
      background: #C9A84C;
      margin: 26px auto;
      flex-shrink: 0;
    }

    .post-headline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: 0.02em;
    }

    .theme-dark  .post-headline { color: #FAF7F2; }
    .theme-light .post-headline { color: #0B1F3A; }

    .post-subtext {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: #C9A84C;
      line-height: 1.35;
      margin-top: 22px;
    }

    .post-caption {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      line-height: 1.72;
      margin-top: 28px;
    }

    .theme-dark  .post-caption { color: rgba(250,247,242,0.42); }
    .theme-light .post-caption { color: rgba(11,31,58,0.42);  }

    .post-url {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Jost', sans-serif;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .theme-dark  .post-url { color: rgba(201,168,76,0.42); }
    .theme-light .post-url { color: rgba(11,31,58,0.32);  }
  </style>
</head>

<body>
<div class="app">

  <!-- ============================================================
       LEFT PANEL
  ============================================================ -->
  <aside class="panel-left">

    <div class="panel-header">
      <span class="panel-wordmark">NÉVUE</span>
      <span class="panel-subtitle">Social Preview Studio</span>
    </div>

    <div class="panel-body">

      <!-- Platform -->
      <div class="field-group">
        <span class="field-label">Platform</span>
        <div class="seg-control" role="group">
          <button class="seg-btn active" onclick="setPlatform('ig-post', this)">IG Post</button>
          <button class="seg-btn"        onclick="setPlatform('ig-story', this)">IG Story</button>
          <button class="seg-btn"        onclick="setPlatform('linkedin', this)">LinkedIn</button>
        </div>
      </div>

      <!-- Theme -->
      <div class="field-group">
        <span class="field-label">Theme</span>
        <div class="seg-control" role="group">
          <button class="seg-btn active" onclick="setTheme('dark', this)">Dark</button>
          <button class="seg-btn"        onclick="setTheme('light', this)">Light</button>
        </div>
      </div>

      <!-- Headline -->
      <div class="field-group">
        <label class="field-label" for="in-headline">Headline</label>
        <input type="text" id="in-headline"
               placeholder="Your Wedding Day, Optimized."
               oninput="syncPreview()">
      </div>

      <!-- Subtext -->
      <div class="field-group">
        <label class="field-label" for="in-subtext">Subtext</label>
        <input type="text" id="in-subtext"
               placeholder="Tampa Bay · Luxury Bridal IV Concierge"
               oninput="syncPreview()">
      </div>

      <!-- Caption -->
      <div class="field-group">
        <label class="field-label" for="in-caption">Caption</label>
        <textarea id="in-caption"
                  placeholder="Premium mobile IV therapy delivered to your venue…"
                  oninput="syncPreview()"></textarea>
      </div>

      <!-- Toggles -->
      <div class="field-group" style="gap:11px;">
        <div class="toggle-row">
          <span class="toggle-label">NÉVUE wordmark</span>
          <label class="toggle">
            <input type="checkbox" id="tog-wordmark" checked onchange="syncPreview()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Gold rule</span>
          <label class="toggle">
            <input type="checkbox" id="tog-rule" checked onchange="syncPreview()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Corner accents</span>
          <label class="toggle">
            <input type="checkbox" id="tog-corners" checked onchange="syncPreview()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Website URL</span>
          <label class="toggle">
            <input type="checkbox" id="tog-url" checked onchange="syncPreview()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
      </div>

      <div class="rule"></div>

      <!-- Actions -->
      <div>
        <button class="btn-primary" id="btn-download" onclick="downloadPNG()">
          <span class="btn-label">Download as PNG</span>
          <div class="spinner btn-spinner"></div>
          <span class="btn-spinner" style="font-size:10px;letter-spacing:0.1em;">Rendering…</span>
        </button>
        <button class="btn-secondary" onclick="savePost()">Save to History</button>
      </div>

    </div>

    <!-- History -->
    <div class="history-section">
      <div class="history-header" onclick="toggleHistory()">
        <span class="history-title">History</span>
        <span class="history-badge" id="history-badge">0 posts</span>
      </div>
      <div class="history-list" id="history-list">
        <p class="history-empty">No posts saved yet.</p>
      </div>
    </div>

  </aside>

  <!-- ============================================================
       RIGHT PANEL — STAGE
  ============================================================ -->
  <main class="panel-right">

    <p class="preview-label" id="preview-label">1080 × 1080 · Instagram Post</p>

    <div class="preview-wrapper" id="preview-wrapper">
      <div class="post-card theme-dark" id="post-card">

        <div class="post-glow"></div>
        <div class="post-bar top"></div>
        <div class="post-bar bottom"></div>

        <div class="post-corner tl"><span></span><span></span></div>
        <div class="post-corner br"><span></span><span></span></div>

        <div class="post-inner" id="post-inner">
          <div class="post-wordmark" id="pv-wordmark">NÉVUE</div>
          <div class="post-gold-rule" id="pv-rule"></div>
          <h2 class="post-headline" id="pv-headline">Your Wedding Day,&nbsp;Optimized.</h2>
          <p class="post-subtext" id="pv-subtext">Tampa Bay · Luxury Bridal IV Concierge</p>
          <p class="post-caption" id="pv-caption"></p>
          <div class="post-url" id="pv-url">nevuewellness.com</div>
        </div>

      </div>
    </div>

  </main>

</div>

<!-- Off-screen render target for html2canvas -->
<div id="render-stage"
     style="position:fixed;left:-99999px;top:0;pointer-events:none;z-index:-1;overflow:hidden;"></div>

<script>
// ──────────────────────────────────────────────────────────────
//  CONFIG
// ──────────────────────────────────────────────────────────────
const FORMATS = {
  'ig-post':  { w: 1080, h: 1080, dh: 480, label: '1080 × 1080 · Instagram Post'  },
  'ig-story': { w: 1080, h: 1920, dh: 480, label: '1080 × 1920 · Instagram Story' },
  'linkedin': { w: 1200, h: 628,  dh: 340, label: '1200 × 628 · LinkedIn'          },
};

const FS = {
  'ig-post':  { wordmark: 26, headline: 84,  subtext: 32, caption: 22, url: 17, pad: '96px 110px',  urlBottom: '76px' },
  'ig-story': { wordmark: 26, headline: 92,  subtext: 34, caption: 24, url: 18, pad: '130px 130px', urlBottom: '90px' },
  'linkedin': { wordmark: 20, headline: 64,  subtext: 26, caption: 20, url: 15, pad: '72px 110px',  urlBottom: '60px' },
};

const state = {
  platform: 'ig-post',
  theme: 'dark',
  history: JSON.parse(localStorage.getItem('nevue-posts') || '[]'),
};

// ──────────────────────────────────────────────────────────────
//  PLATFORM & THEME
// ──────────────────────────────────────────────────────────────
function setPlatform(p, btn) {
  state.platform = p;
  activateBtn(btn, '.seg-btn', btn.closest('.seg-control'));
  applyFormat();
  syncPreview();
}

function setTheme(t, btn) {
  state.theme = t;
  activateBtn(btn, '.seg-btn', btn.closest('.seg-control'));
  const card = document.getElementById('post-card');
  card.className = `post-card theme-${t}`;
}

function activateBtn(btn, selector, scope) {
  scope.querySelectorAll(selector).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ──────────────────────────────────────────────────────────────
//  APPLY FORMAT  (scale preview to fit stage)
// ──────────────────────────────────────────────────────────────
function applyFormat() {
  const fmt   = FORMATS[state.platform];
  const fs    = FS[state.platform];
  const scale = fmt.dh / fmt.h;
  const dw    = Math.round(fmt.w * scale);

  const wrapper = document.getElementById('preview-wrapper');
  const card    = document.getElementById('post-card');
  const inner   = document.getElementById('post-inner');

  wrapper.style.width  = dw  + 'px';
  wrapper.style.height = fmt.dh + 'px';

  card.style.width  = fmt.w + 'px';
  card.style.height = fmt.h + 'px';
  card.style.transform = `scale(${scale})`;

  inner.style.padding = fs.pad;

  document.getElementById('pv-wordmark').style.fontSize = fs.wordmark + 'px';
  document.getElementById('pv-headline').style.fontSize = fs.headline + 'px';
  document.getElementById('pv-subtext').style.fontSize  = fs.subtext  + 'px';
  document.getElementById('pv-caption').style.fontSize  = fs.caption  + 'px';
  document.getElementById('pv-url').style.fontSize      = fs.url      + 'px';
  document.getElementById('pv-url').style.bottom        = fs.urlBottom;

  document.getElementById('preview-label').textContent = fmt.label;
}

// ──────────────────────────────────────────────────────────────
//  LIVE SYNC
// ──────────────────────────────────────────────────────────────
function syncPreview() {
  const headline = val('in-headline');
  const subtext  = val('in-subtext');
  const caption  = val('in-caption');

  setText('pv-headline', headline || 'Your headline here.');
  setText('pv-subtext',  subtext);
  setText('pv-caption',  caption);

  show('pv-wordmark', get('tog-wordmark').checked);
  show('pv-rule',     get('tog-wordmark').checked && get('tog-rule').checked);
  show('pv-subtext',  !!subtext);
  show('pv-url',      get('tog-url').checked);

  document.querySelectorAll('.post-corner').forEach(el => {
    el.style.visibility = get('tog-corners').checked ? 'visible' : 'hidden';
  });
}

// ──────────────────────────────────────────────────────────────
//  DOWNLOAD AS PNG
// ──────────────────────────────────────────────────────────────
async function downloadPNG() {
  const btn = document.getElementById('btn-download');
  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const fmt  = FORMATS[state.platform];
    const node = buildRenderCard(fmt.w, fmt.h);

    const stage = document.getElementById('render-stage');
    stage.style.width  = fmt.w + 'px';
    stage.style.height = fmt.h + 'px';
    stage.innerHTML = '';
    stage.appendChild(node);

    await waitFrames(3);

    const canvas = await html2canvas(node, {
      width:           fmt.w,
      height:          fmt.h,
      scale:           2,
      useCORS:         true,
      allowTaint:      true,
      backgroundColor: state.theme === 'dark' ? '#0B1F3A' : '#FAF7F2',
      logging:         false,
    });

    stage.innerHTML = '';

    const ts       = timestamp();
    const filename = `nevue-${state.platform}-${ts}.png`;
    triggerDownload(canvas.toDataURL('image/png'), filename);

  } catch (err) {
    console.error(err);
    alert('PNG export failed — please try again.');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// ──────────────────────────────────────────────────────────────
//  SAVE TO HISTORY + EXPORT HTML
// ──────────────────────────────────────────────────────────────
function savePost() {
  const now = new Date();
  const entry = {
    id:        Date.now(),
    iso:       now.toISOString(),
    dateLabel: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
               + ' · ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
    platform:  state.platform,
    theme:     state.theme,
    headline:  val('in-headline'),
    subtext:   val('in-subtext'),
    caption:   val('in-caption'),
    showWordmark: get('tog-wordmark').checked,
    showRule:     get('tog-rule').checked,
    showCorners:  get('tog-corners').checked,
    showUrl:      get('tog-url').checked,
  };

  state.history.unshift(entry);
  if (state.history.length > 24) state.history.length = 24;
  localStorage.setItem('nevue-posts', JSON.stringify(state.history));

  renderHistory();
  exportHTML(entry);
}

// ──────────────────────────────────────────────────────────────
//  BUILD FULL-SIZE RENDER CARD
// ──────────────────────────────────────────────────────────────
function buildRenderCard(w, h, entry) {
  const platform = entry ? entry.platform : state.platform;
  const theme    = entry ? entry.theme    : state.theme;
  const fs       = FS[platform];

  const headline     = (entry ? entry.headline     : val('in-headline')) || 'Your headline here.';
  const subtext      = entry ? entry.subtext      : val('in-subtext');
  const caption      = entry ? entry.caption      : val('in-caption');
  const showWordmark = entry ? entry.showWordmark  : get('tog-wordmark').checked;
  const showRule     = entry ? entry.showRule      : get('tog-rule').checked;
  const showCorners  = entry ? entry.showCorners   : get('tog-corners').checked;
  const showUrl      = entry ? entry.showUrl       : get('tog-url').checked;

  const bg        = theme === 'dark' ? '#0B1F3A'              : '#FAF7F2';
  const textMain  = theme === 'dark' ? '#FAF7F2'              : '#0B1F3A';
  const textMuted = theme === 'dark' ? 'rgba(250,247,242,0.42)' : 'rgba(11,31,58,0.42)';
  const urlColor  = theme === 'dark' ? 'rgba(201,168,76,0.45)' : 'rgba(11,31,58,0.32)';
  const cornerClr = theme === 'dark' ? 'rgba(201,168,76,0.32)' : 'rgba(11,31,58,0.18)';
  const glowClr   = theme === 'dark' ? 'rgba(201,168,76,0.08)' : 'rgba(11,31,58,0.04)';

  const padParts = fs.pad.split(' ');
  const padV = parseInt(padParts[0]);
  const padH = parseInt(padParts[1]);

  const el = (tag, css, text) => {
    const d = document.createElement(tag || 'div');
    if (css)  Object.assign(d.style, css);
    if (text !== undefined) d.textContent = text;
    return d;
  };

  const card = el('div', {
    position: 'relative', width: w + 'px', height: h + 'px',
    background: bg, overflow: 'hidden', fontFamily: "'Cormorant Garamond', Georgia, serif",
  });

  // Glow
  card.appendChild(el('div', {
    position: 'absolute', inset: '0',
    background: `radial-gradient(ellipse at 50% 48%, ${glowClr} 0%, transparent 62%)`,
  }));

  // Bars
  ['top', 'bottom'].forEach(side => {
    card.appendChild(el('div', {
      position: 'absolute', [side]: '0', left: '0', right: '0', height: '2px',
      background: 'linear-gradient(to right, transparent 0%, #C9A84C 25%, #C9A84C 75%, transparent 100%)',
    }));
  });

  // Corners
  if (showCorners) {
    [{ top: '56px', left: '56px' }, { bottom: '56px', right: '56px' }].forEach(pos => {
      const wrap = el('div', { position: 'absolute', width: '60px', height: '60px', ...pos });
      const isBottom = 'bottom' in pos;
      const v = el('div', {
        position: 'absolute', width: '1px', height: '60px', background: cornerClr,
        [isBottom ? 'bottom' : 'top']: '0',
        [isBottom ? 'right'  : 'left']: '0',
      });
      const h = el('div', {
        position: 'absolute', width: '60px', height: '1px', background: cornerClr,
        [isBottom ? 'bottom' : 'top']: '0',
        [isBottom ? 'right'  : 'left']: '0',
      });
      wrap.appendChild(v);
      wrap.appendChild(h);
      card.appendChild(wrap);
    });
  }

  // Content wrapper
  const inner = el('div', {
    position: 'absolute', inset: '0', display: 'flex', flexDirection: 'column',
    alignItems: 'center', justifyContent: 'center', textAlign: 'center',
    padding: `${padV}px ${padH}px`,
  });

  if (showWordmark) {
    inner.appendChild(el('div', {
      fontFamily: "'Cormorant Garamond', Georgia, serif",
      fontSize: fs.wordmark + 'px', fontWeight: '600',
      letterSpacing: '0.28em', textTransform: 'uppercase', color: textMain,
    }, 'NÉVUE'));

    if (showRule) {
      inner.appendChild(el('div', {
        width: '56px', height: '1px', background: '#C9A84C',
        margin: '24px auto', flexShrink: '0',
      }));
    }
  }

  inner.appendChild(el('h2', {
    fontFamily: "'Cormorant Garamond', Georgia, serif",
    fontSize: fs.headline + 'px', fontWeight: '300',
    lineHeight: '1.08', letterSpacing: '0.02em', color: textMain, margin: '0',
  }, headline));

  if (subtext) {
    inner.appendChild(el('p', {
      fontFamily: "'Cormorant Garamond', Georgia, serif",
      fontSize: fs.subtext + 'px', fontStyle: 'italic',
      color: '#C9A84C', lineHeight: '1.35', marginTop: '20px',
    }, subtext));
  }

  if (caption) {
    inner.appendChild(el('p', {
      fontFamily: "'Jost', sans-serif", fontSize: fs.caption + 'px',
      fontWeight: '300', lineHeight: '1.72', color: textMuted,
      marginTop: '26px', maxWidth: Math.round(w * 0.76) + 'px',
    }, caption));
  }

  card.appendChild(inner);

  if (showUrl) {
    card.appendChild(el('div', {
      position: 'absolute', bottom: fs.urlBottom, left: '0', right: '0',
      textAlign: 'center', fontFamily: "'Jost', sans-serif",
      fontSize: fs.url + 'px', fontWeight: '400',
      letterSpacing: '0.18em', textTransform: 'uppercase', color: urlColor,
    }, 'nevuewellness.com'));
  }

  return card;
}

// ──────────────────────────────────────────────────────────────
//  EXPORT STANDALONE HTML
// ──────────────────────────────────────────────────────────────
function exportHTML(entry) {
  const fmt  = FORMATS[entry.platform];
  const display = 600;
  const dh = Math.round(fmt.h * display / fmt.w);
  const fs = FS[entry.platform];

  const bg       = entry.theme === 'dark' ? '#0B1F3A' : '#FAF7F2';
  const textMain = entry.theme === 'dark' ? '#FAF7F2' : '#0B1F3A';
  const textMuted = entry.theme === 'dark' ? 'rgba(250,247,242,0.42)' : 'rgba(11,31,58,0.42)';
  const urlColor  = entry.theme === 'dark' ? 'rgba(201,168,76,0.45)'  : 'rgba(11,31,58,0.32)';
  const s = display / fmt.w;          // scale factor for font sizes in the HTML preview
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const wmHTML = entry.showWordmark ? `
    <div style="font-family:'Cormorant Garamond',serif;font-size:${Math.round(fs.wordmark*s)}px;font-weight:600;letter-spacing:0.28em;text-transform:uppercase;color:${textMain};">NÉVUE</div>
    ${entry.showRule ? `<div style="width:${Math.round(56*s)}px;height:1px;background:#C9A84C;margin:${Math.round(24*s)}px auto;"></div>` : ''}
  ` : '';

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NÉVUE · ${esc(entry.platform)} · ${esc(entry.headline || 'Post')}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; font-family: 'Jost', sans-serif; }
    .meta { font-size: 10px; letter-spacing: 0.14em; color: rgba(255,255,255,0.22); text-transform: uppercase; }
  </style>
</head>
<body>
  <p class="meta">${esc(fmt.label)} · Saved ${esc(entry.dateLabel)}</p>
  <div style="position:relative;width:${display}px;height:${dh}px;background:${bg};overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.65);">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,${entry.theme==='dark'?'rgba(201,168,76,0.08)':'rgba(11,31,58,0.04)'} 0%,transparent 62%);"></div>
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,#C9A84C 25%,#C9A84C 75%,transparent);"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,#C9A84C 25%,#C9A84C 75%,transparent);"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:${Math.round(parseInt(fs.pad)*s)}px ${Math.round(parseInt(fs.pad.split(' ')[1]||fs.pad)*s)}px;">
      ${wmHTML}
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:${Math.round(fs.headline*s)}px;font-weight:300;line-height:1.08;color:${textMain};margin:0;">${esc(entry.headline||'')}</h2>
      ${entry.subtext ? `<p style="font-family:'Cormorant Garamond',serif;font-size:${Math.round(fs.subtext*s)}px;font-style:italic;color:#C9A84C;margin:${Math.round(20*s)}px 0 0;">${esc(entry.subtext)}</p>` : ''}
      ${entry.caption ? `<p style="font-family:'Jost',sans-serif;font-size:${Math.round(fs.caption*s)}px;font-weight:300;line-height:1.72;color:${textMuted};margin:${Math.round(26*s)}px 0 0;max-width:76%;">${esc(entry.caption)}</p>` : ''}
    </div>
    ${entry.showUrl ? `<div style="position:absolute;bottom:${Math.round(parseInt(fs.urlBottom)*s)}px;left:0;right:0;text-align:center;font-family:'Jost',sans-serif;font-size:${Math.round(fs.url*s)}px;letter-spacing:0.18em;text-transform:uppercase;color:${urlColor};">nevuewellness.com</div>` : ''}
  </div>
</body>
</html>`;

  const ts = timestamp();
  triggerDownload(
    URL.createObjectURL(new Blob([html], { type: 'text/html' })),
    `nevue-${entry.platform}-${ts}.html`,
    true
  );
}

// ──────────────────────────────────────────────────────────────
//  HISTORY UI
// ──────────────────────────────────────────────────────────────
function renderHistory() {
  const list  = document.getElementById('history-list');
  const badge = document.getElementById('history-badge');
  const h     = state.history;

  badge.textContent = h.length + (h.length === 1 ? ' post' : ' posts');

  if (h.length === 0) {
    list.innerHTML = '<p class="history-empty">No posts saved yet.</p>';
    return;
  }

  const platformLabel = { 'ig-post': 'IG Post', 'ig-story': 'IG Story', 'linkedin': 'LinkedIn' };

  list.innerHTML = h.map((e, i) => `
    <div class="history-item">
      <div class="history-item-info">
        <div class="history-item-headline">${escHtml(e.headline || 'Untitled')}</div>
        <div class="history-item-meta">${platformLabel[e.platform] || e.platform} · ${escHtml(e.dateLabel)}</div>
      </div>
      <button class="history-item-export" onclick="exportHTML(state.history[${i}])">Export</button>
    </div>
  `).join('');
}

function toggleHistory() {
  const list = document.getElementById('history-list');
  list.style.display = list.style.display === 'none' ? 'flex' : 'flex';
}

// ──────────────────────────────────────────────────────────────
//  UTILITIES
// ──────────────────────────────────────────────────────────────
const val  = id => document.getElementById(id).value.trim();
const get  = id => document.getElementById(id);
const setText = (id, text) => { document.getElementById(id).textContent = text; };
const show = (id, v) => { document.getElementById(id).style.display = v ? '' : 'none'; };

function waitFrames(n) {
  return new Promise(res => {
    let i = 0;
    const tick = () => (++i < n) ? requestAnimationFrame(tick) : res();
    requestAnimationFrame(tick);
  });
}

function timestamp() {
  return new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
}

function triggerDownload(href, filename, isObjectURL) {
  const a = document.createElement('a');
  a.href = href;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  if (isObjectURL) setTimeout(() => URL.revokeObjectURL(href), 1000);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ──────────────────────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────────────────────
applyFormat();
syncPreview();
renderHistory();
</script>
